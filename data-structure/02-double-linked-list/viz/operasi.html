<body class="viz">

<h1>Operasi double linked list</h1>
<p>Pilih operasi, lalu jalankan <b>step by step</b>. Pointer yang baru berubah berwarna <b>oranye</b>. Nyalakan <b>mode tebak</b> untuk menebak tiap langkah sebelum ditampilkan.</p>

<script src="../../../_shared/listviz.js"></script>
<script>
const CODE = {
  struct: `typedef struct Node {
    int data;
    struct Node* prev;
    struct Node* next;
} Node;

Node* head = NULL;
Node* tail = NULL;
int size = 0;

Node* createNode(int x) {
    Node* n = malloc(sizeof(Node));
    n->data = x;
    n->prev = n->next = NULL;
    return n;
}`,
  insertFront: `void insertFront(int x) {
    Node* newNode = createNode(x);
    if (head == NULL) {
        head = tail = newNode;
    } else {
        newNode->next = head;
        head->prev = newNode;
        head = newNode;
    }
    size++;
}`,
  insertBack: `void insertBack(int x) {
    Node* newNode = createNode(x);
    if (tail == NULL) {
        head = tail = newNode;
    } else {
        newNode->prev = tail;
        tail->next = newNode;
        tail = newNode;
    }
    size++;
}`,
  insertAt: `void insertAt(int pos, int x) {
    if (pos == 0) { insertFront(x); return; }
    if (pos == size) { insertBack(x); return; }
    Node* cur = head;
    for (int i = 0; i < pos; i++)
        cur = cur->next;
    Node* newNode = createNode(x);
    newNode->next = cur;
    newNode->prev = cur->prev;
    cur->prev->next = newNode;
    cur->prev = newNode;
    size++;
}`,
  deleteAt: `void deleteAt(int pos) {
    Node* del = head;
    for (int i = 0; i < pos; i++)
        del = del->next;
    if (del->prev != NULL)
        del->prev->next = del->next;
    else
        head = del->next;
    if (del->next != NULL)
        del->next->prev = del->prev;
    else
        tail = del->prev;
    free(del);
    size--;
}`,
  search: `Node* search(int x) {
    Node* cur = head;
    while (cur != NULL) {
        if (cur->data == x)
            return cur;
        cur = cur->next;
    }
    return NULL;
}`,
  printForward: `void printForward() {
    Node* cur = head;
    while (cur != NULL) {
        printf("%d ", cur->data);
        cur = cur->next;
    }
}`,
  printBackward: `void printBackward() {
    Node* cur = tail;
    while (cur != NULL) {
        printf("%d ", cur->data);
        cur = cur->prev;
    }
}`,
};
for (const k in CODE) CODE[k] = CODE[k].split('\n');

/* ---------- Operasi: setiap yield adalah satu langkah. Caption menjelaskan KENAPA, bukan cuma APA. ---------- */
function* insertFront(x) {
  const c = 'insertFront';
  const n = make(x, 0);
  yield step(c, 'createNode', `Buat node baru berisi ${x}. prev dan next masih NULL, jadi node ini belum terhubung ke list.`, ['newNode']);
  if (head === null) {
    head = tail = n.id;
    yield step(c, 'head = tail', 'List kosong: node baru jadi satu-satunya node, jadi dia sekaligus node pertama (head) dan terakhir (tail).', ['head', 'tail']);
  } else {
    n.next = head;
    yield step(c, 'newNode->next = head', `Sambungkan node baru ke list DULU. head masih menyimpan alamat node ${val(head)}, jadi alamat itu belum hilang.`, [n.id + '.next']);
    nodes[head].prev = n.id;
    yield step(c, 'head->prev = newNode', `Sisi pasangannya: node ${val(head)} menunjuk balik ke node baru. Setiap next butuh prev pasangan.`, [head + '.prev']);
    head = n.id;
    yield step(c, 'head = newNode', 'Baru sekarang head boleh pindah, karena node lama sudah aman tersambung lewat newNode->next.', ['head']);
  }
  yield* finishInsert(c, n);
}

function* insertBack(x) {
  const c = 'insertBack';
  const n = make(x, order.length);
  yield step(c, 'createNode', `Buat node baru berisi ${x}. prev dan next masih NULL.`, ['newNode']);
  if (tail === null) {
    head = tail = n.id;
    yield step(c, 'head = tail', 'List kosong: node baru sekaligus head dan tail.', ['head', 'tail']);
  } else {
    n.prev = tail;
    yield step(c, 'newNode->prev = tail', `Cermin dari insertFront: sambungkan node baru ke node terakhir (${val(tail)}) dulu.`, [n.id + '.prev']);
    nodes[tail].next = n.id;
    yield step(c, 'tail->next = newNode', `Sisi pasangannya: node ${val(tail)} menunjuk node baru lewat next.`, [tail + '.next']);
    tail = n.id;
    yield step(c, 'tail = newNode', 'Baru tail pindah. Karena tail selalu tersedia, kita tidak perlu traverse: O(1).', ['tail']);
  }
  yield* finishInsert(c, n);
}

function* insertAt(pos, x) {
  const c = 'insertAt';
  if (pos === 0) {
    yield step(c, 'pos == 0', 'Posisi 0 = depan list. Kasus ini sudah ditangani insertFront, jadi pakai ulang saja.');
    return yield* insertFront(x);
  }
  if (pos === order.length) {
    yield step(c, 'pos == size', `Posisi ${pos} = setelah node terakhir. Pakai ulang insertBack.`);
    return yield* insertBack(x);
  }
  vars.cur = head;
  yield step(c, 'Node* cur = head', 'Posisi ada di tengah. Kita cari node yang SEKARANG ada di posisi itu, mulai dari head.', ['cur']);
  for (let i = 0; i < pos; i++) {
    vars.cur = nodes[vars.cur].next;
    yield step(c, 'cur = cur->next', `i = ${i}: cur maju satu node. Loop jalan ${pos} kali, jadi cur berhenti tepat di posisi ${pos}.`, ['cur']);
  }
  const cur = nodes[vars.cur];
  const n = make(x, order.indexOf(cur.id));
  yield step(c, 'createNode', `Node baru akan masuk di antara node ${val(cur.prev)} dan cur (${cur.val}).`, ['newNode']);
  n.next = cur.id;
  yield step(c, 'newNode->next = cur', 'Isi pointer milik node baru dulu. Ini aman, karena list sendiri belum berubah.', [n.id + '.next']);
  n.prev = cur.prev;
  yield step(c, 'newNode->prev = cur->prev', `prev node baru = node sebelum cur (${val(cur.prev)}). Kita masih bisa membaca cur->prev karena belum diubah.`, [n.id + '.prev']);
  nodes[cur.prev].next = n.id;
  yield step(c, 'cur->prev->next = newNode', `Sekarang ubah list: node ${val(cur.prev)} menunjuk node baru. cur->prev masih nilai lama, jadi alamat node ${val(cur.prev)} masih bisa dicapai.`, [cur.prev + '.next']);
  cur.prev = n.id;
  yield step(c, 'cur->prev = newNode', 'Terakhir: cur->prev diubah. Ini harus paling akhir, karena dua baris sebelumnya masih butuh nilai lamanya.', [cur.id + '.prev']);
  delete vars.cur;
  yield* finishInsert(c, n);
}

function* deleteAt(pos) {
  const c = 'deleteAt';
  vars.del = head;
  yield step(c, 'Node* del = head', 'Cari node yang mau dihapus, mulai dari head.', ['del']);
  for (let i = 0; i < pos; i++) {
    vars.del = nodes[vars.del].next;
    yield step(c, 'del = del->next', `i = ${i}: del maju satu node.`, ['del']);
  }
  const d = nodes[vars.del];
  if (d.prev !== null) {
    nodes[d.prev].next = d.next;
    yield step(c, 'del->prev->next = del->next', `Node ${val(d.prev)} melompati del: next-nya langsung ke ${d.next === null ? 'NULL' : 'node ' + val(d.next)}. Kita tahu node sebelumnya lewat del->prev, tanpa mencari.`, [d.prev + '.next']);
  } else {
    head = d.next;
    yield step(c, 'head = del->next', 'del->prev == NULL berarti del node pertama. Tidak ada node sebelumnya untuk diubah, jadi yang pindah adalah head.', ['head']);
  }
  if (d.next !== null) {
    nodes[d.next].prev = d.prev;
    yield step(c, 'del->next->prev = del->prev', `Arah sebaliknya: node ${val(d.next)} melompati del, prev-nya langsung ke ${d.prev === null ? 'NULL' : 'node ' + val(d.prev)}.`, [d.next + '.prev']);
  } else {
    tail = d.prev;
    yield step(c, 'tail = del->prev', 'del->next == NULL berarti del node terakhir, jadi yang pindah adalah tail.', ['tail']);
  }
  d.lifted = true;
  yield step(c, 'free(del)', 'Tidak ada lagi pointer di list yang menunjuk del. Baru sekarang aman di-free. Kalau di-free lebih awal, del->prev dan del->next tidak bisa dibaca lagi.');
  remove(d.id);
  delete vars.del;
  yield done(c, 'size--', `Selesai. Node ${d.val} sudah di-delete. List sekarang berisi ${order.length} node.`);
}

function* search(x) {
  const c = 'search';
  vars.cur = head;
  yield step(c, 'Node* cur = head', 'Linked list tidak punya index, jadi satu-satunya cara: cek node satu per satu dari head.', ['cur']);
  while (vars.cur !== null) {
    const n = nodes[vars.cur];
    if (n.val === x) {
      found = n.id;
      delete vars.cur;
      return yield done(c, 'return cur', `${n.val} == ${x}. Ketemu di posisi ${order.indexOf(n.id)}, langsung return.`);
    }
    yield step(c, 'if (cur->data == x)', `${n.val} != ${x}, lanjut.`);
    vars.cur = n.next;
    yield step(c, 'cur = cur->next', vars.cur === null ? 'cur sekarang NULL: sudah lewat node terakhir, jadi loop berhenti.' : 'cur maju satu node.', ['cur']);
  }
  delete vars.cur;
  yield done(c, 'return NULL', `${x} tidak ada di list. Return NULL sebagai tanda "tidak ketemu".`);
}

function* traverse(c, start, dir) {
  output = [];
  vars.cur = start;
  yield step(c, 'Node* cur', `Pola traversal: mulai dari ${start === head ? 'head' : 'tail'}, maju terus sampai NULL.`, ['cur']);
  while (vars.cur !== null) {
    output.push(nodes[vars.cur].val);
    yield step(c, 'printf', `Print ${nodes[vars.cur].val}.`);
    vars.cur = nodes[vars.cur][dir];
    yield step(c, `cur = cur->${dir}`, vars.cur === null ? 'cur sekarang NULL, jadi loop berhenti.' : `cur pindah lewat pointer ${dir}.`, ['cur']);
  }
  delete vars.cur;
  yield done(c, 'while', `Selesai. Output: ${output.join(' ') || '(kosong)'}.`);
}

const OPS = {
  insertFront: (x) => insertFront(x),
  insertBack: (x) => insertBack(x),
  insertAt: (x, p) => insertAt(p, x),
  deleteAt: (x, p) => deleteAt(p),
  search: (x) => search(x),
  printForward: () => traverse('printForward', head, 'next'),
  printBackward: () => traverse('printBackward', tail, 'prev'),
};
const check = checkCommon;
listViz({ doubly: true });
</script>
</body>
</html>
